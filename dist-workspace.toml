[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# A custom Homebrew tap to publish the formula to: `brew install kshitijl/tap/psychic`
tap = "kshitijl/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Build every artifact on pull requests too, so a Linux build can be downloaded
# and tried before anything is released
pr-run-mode = "upload"
# The package is `psychic-cli` (crates.io); everything users see is `psychic`.
# Archives and the shell installer can't be renamed, so they're `psychic-cli-*`.
formula = "psychic"
display-name = "psychic"
