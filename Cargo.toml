[package]
# `psychic` on crates.io belongs to an unrelated crate. The binary, the
# Homebrew formula and the data directory are all still `psychic`.
name = "psychic-cli"
version = "0.3.0"
edition = "2024"
description = "Smarter file explorer and cd replacement that learns from your actions and ranks files with a model trained on your machine"
license = "MIT"
repository = "https://github.com/kshitijl/psychic"
homepage = "https://github.com/kshitijl/psychic"
# What `cargo publish` uploads: the build needs src/ and the zsh script it
# embeds. Not bench/, notebooks, train.py or the Python project.
include = ["/src/**/*", "/shell/psychic.zsh", "/README.md", "/LICENSE"]

[[bin]]
name = "psychic"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = "0.1"
syntect = { version = "5", default-features = false, features = ["default-onig"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-onig"] }
timeago = "0.4"
csv = "1.3"
regex = "1"
clap = { version = "4.4", features = ["derive"] }
lightgbm3 = "1.0"
# Training needs parts of the C API that `lightgbm3` does not wrap: query
# groups and validation sets. Same crate `lightgbm3` builds on, so one copy
# of LightGBM is linked.
lightgbm3-sys = "1.0"
log = "0.4"
fern = "0.6"
once_cell = "1.19"
rayon = "1.10"
rustc-hash = "2.0"
libc = "0.2"
unicode-width = "0.2"
signal-hook = { version = "0.3", default-features = false, features = ["channel"] }
strum = "0.26"
strum_macros = "0.26"
fuzzy-matcher = "0.3"
rand = "0.8"

[dev-dependencies]
serde_json = "1.0"

# The profile that 'dist' will build with. Exactly `release`, so the binary
# people download is the one `bench/` measures.
[profile.dist]
inherits = "release"
