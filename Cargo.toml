[package]
name = "psychic"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "psychic"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = "0.1"
syntect = { version = "5", default-features = false, features = ["default-onig"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-onig"] }
timeago = "0.4"
csv = "1.3"
regex = "1"
clap = { version = "4.4", features = ["derive"] }
lightgbm3 = "1.0"
log = "0.4"
fern = "0.6"
once_cell = "1.19"
rayon = "1.10"
rustc-hash = "2.0"
libc = "0.2"
unicode-width = "0.2"
signal-hook = { version = "0.3", default-features = false, features = ["channel"] }
strum = "0.26"
strum_macros = "0.26"
fuzzy-matcher = "0.3"
rand = "0.8"

[dev-dependencies]
serde_json = "1.0"
